<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Thank You | Crown Asia Chemicals Corporation</title>
  <style>
    body {
      font-family: 'Open Sans', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #f7f7f7;
    }
    .box {
      background: white;
      border-top: 4px solid #CC0000;
      padding: 50px 40px;
      text-align: center;
      max-width: 480px;
      width: 90%;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }
    .checkmark { font-size: 52px; margin-bottom: 16px; }
    h1 { font-size: 26px; color: #CC0000; margin-bottom: 10px; }
    p { font-size: 15px; color: #555; line-height: 1.7; margin-bottom: 24px; }
    a {
      display: inline-block;
      background: #CC0000;
      color: white;
      padding: 10px 28px;
      text-decoration: none;
      font-weight: 700;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-radius: 2px;
    }
    a:hover { background: #a00; }
  </style>
</head>
<body>
  <div class="box">
    <div class="checkmark">✅</div>
    <h1>Thank You!</h1>
    <p>Your request has been submitted successfully.<br>
    Our team at Crown Asia will contact you shortly.</p>
    <a href="https://crownpvc.com.ph">Back to Website</a>
  </div>
</body>
</html>
